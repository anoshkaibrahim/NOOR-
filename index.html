.logo{font:700 22px Amiri,serif;color:#fff;text-decoration:none;margin-right:auto}.logo span{color:var(--gold)}
nav{display:flex;gap:4px;flex-wrap:wrap}

main{max-width:1100px;margin:auto;padding:20px 16px 40px;animation:f .5s}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.card.big{grid-column:1/-1}
.ar{font:400 28px/2 Amiri,serif;direction:rtl;text-align:right;color:var(--g)}

.ref{color:var(--mu);font-size:13px}.en{margin:4px 0}
.sh{margin-top:8px}
.srf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.srf a{display:block;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);text-decoration:none;font-size:14px}
.srf a:hover{border-color:var(--gold)}.srf b{color:var(--gold);margin-right:6px}
.nm{text-align:center}.nm .ar{text-align:center;font-size:30px;line-height:1.6}

form{display:grid;gap:10px;max-width:520px}input,textarea{padding:10px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--card);color:var(--tx)}
footer{background:#0b5d3b;color:#e8f0ea;text-align:center;padding:24px 16px;border-top:3px solid var(--gold);font-size:14px}footer a{color:#ffe9a0}
body{-webkit-tap-highlight-color:transparent}.card{border-radius:18px}.btn:active,.tb:active,.card:active,.srf a:active{transform:scale(.97)}
#tab{display:none;position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.1)}
#tab a{flex:1;text-align:center;text-decoration:none;color:var(--mu);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:12px;transition:.2s}
#tab a i{font-style:normal;font-size:21px;line-height:1}
#tab a.on{color:var(--g);background:rgba(201,162,39,.2);font-weight:600}
@media(max-width:768px){nav{display:none}#tab{display:flex}.bar{flex-wrap:nowrap;padding:8px 14px}.logo{font-size:20px}.sb input{width:105px;font-size:16px}main{padding-bottom:90px}footer{padding-bottom:90px}.hero{padding:36px 14px;border-radius:22px}h2{font-size:24px}}
